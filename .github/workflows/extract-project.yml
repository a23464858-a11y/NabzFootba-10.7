name: Extract Nabz Football project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f NabzFootball.zip
          rm -rf /tmp/nabz-project
          mkdir -p /tmp/nabz-project
          unzip -q NabzFootball.zip -d /tmp/nabz-project
          test -d /tmp/nabz-project/NabzFootball
          cp -a /tmp/nabz-project/NabzFootball/. .
          rm -f NabzFootball.zip

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract Nabz Football Android project"
            git push
          fi
